<title>Junio · Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Permanent+Marker&display=swap">
<style>
/* Layout: a working table. The phone (or tablet, or owner desk) sits in the middle; notes for the owner sit beside it. One brand look, bone paper and Junio black, so it stays single-theme on purpose. */
:root{
  --negro:#1D1D1B; --hueso:#F1EDE6; --salvia:#9AA98F; --oliva:#A0A082; --crema:#F9ECD2; --salvia-cl:#CED2BB;
  --linea:#d9d3c8; --tinta-2:#55544f; --ok:#5c7a4f; --alerta:#b5532f;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pincel:"Permanent Marker","Archivo",cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--hueso);color:var(--negro)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--negro);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--negro)}
a{color:inherit}
.logo{display:inline-block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo.full{aspect-ratio:214/144}
.logo.word{aspect-ratio:214/117;-webkit-mask-size:100% auto;mask-size:100% auto;-webkit-mask-position:top;mask-position:top}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--negro);color:var(--crema);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--negro)}
.top .logo{width:74px;color:var(--crema)}
.top .meta{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--salvia-cl);flex:1;min-width:140px}
.seg{display:flex;gap:4px;background:#2d2d2a;border-radius:20px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--crema);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--salvia);color:var(--negro)}

.wrap{max-width:1240px;margin:0 auto;padding-top:28px}
.intro{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.intro h1{font-family:var(--display);font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:clamp(30px,5vw,54px);line-height:.92;margin:0;letter-spacing:-.01em;text-wrap:balance}
.intro p{margin:0;max-width:56ch;color:var(--tinta-2)}

/* ---------- client layout ---------- */
.stage{display:grid;grid-template-columns:240px minmax(0,auto) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:1100px){.stage{grid-template-columns:minmax(0,auto) minmax(0,1fr)}.stage .index{grid-column:1/-1;order:3}}
@media (max-width:760px){.stage{grid-template-columns:minmax(0,1fr)}.stage .notes{order:2}}
.index h3,.notes h3,.panel h3{font-family:var(--display);font-weight:900;font-stretch:80%;text-transform:uppercase;font-size:13px;letter-spacing:.08em;margin:0 0 10px}
.index ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
@media (max-width:1100px){.index ol{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.index button{width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;display:flex;gap:10px;align-items:baseline;font-size:14px}
.index button:hover{background:#e6e0d5}
.index button[aria-current="true"]{background:var(--negro);color:var(--crema)}
.index .n{font-variant-numeric:tabular-nums;font-size:11px;opacity:.6;width:18px;flex:none}
.notes{display:grid;gap:18px;min-width:0}
.note-card{border-top:2px solid var(--negro);padding-top:12px}
.note-card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.note-card p{margin:0 0 8px}
.demo-btns{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:1.5px solid var(--negro);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip-btn:hover{background:var(--negro);color:var(--crema)}
.small{font-size:12.5px;color:var(--tinta-2)}

/* ---------- phone ---------- */
.phone{width:390px;max-width:100%;height:800px;border-radius:46px;background:var(--negro);padding:12px;box-shadow:0 30px 60px -30px rgba(29,29,27,.55);position:relative;justify-self:center}
.screen{position:relative;height:100%;border-radius:36px;overflow:hidden;background:var(--hueso);display:flex;flex-direction:column}
@media (max-width:440px){.phone{width:100%;height:760px;padding:0;border-radius:24px;box-shadow:none;background:transparent}.screen{border-radius:24px;border:1.5px solid var(--negro)}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.status .isl{width:96px;height:26px;border-radius:20px;background:var(--negro)}
.status.dark{background:var(--negro);color:var(--crema)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:8px 20px 24px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px 22px;background:var(--hueso);border-top:1.5px solid var(--negro)}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 0;color:var(--tinta-2)}
.tabbar button[aria-current="true"]{color:var(--negro)}
.tabbar svg{width:24px;height:24px}
.tabbar .mid{transform:translateY(-14px)}
.tabbar .mid .disc{width:58px;height:58px;border-radius:50%;background:var(--negro);color:var(--crema);display:grid;place-items:center;border:4px solid var(--hueso)}
.tabbar .mid[aria-current="true"] .disc{background:var(--salvia);color:var(--negro)}

/* type inside the app */
.h-xl{font-family:var(--display);font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:40px;line-height:.9;margin:0;letter-spacing:-.01em}
.h-l{font-family:var(--display);font-weight:900;font-stretch:78%;text-transform:uppercase;font-size:26px;line-height:.95;margin:0}
.h-m{font-family:var(--display);font-weight:800;font-stretch:85%;text-transform:uppercase;font-size:16px;line-height:1.1;margin:0;letter-spacing:.01em}
.brush{font-family:var(--pincel);font-size:24px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2)}
.muted{color:var(--tinta-2)}
.price{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;font-stretch:90%}
.btn.dark{background:var(--negro);color:var(--crema)}
.btn.sage{background:var(--salvia);color:var(--negro)}
.btn.line{background:transparent;border:1.5px solid var(--negro)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.pad{min-width:0}.pad>*,.stack>*{min-width:0}
@media (max-width:560px){.top .meta{display:none}}
.card{background:#fbf9f5;border:1.5px solid var(--negro);border-radius:18px;padding:16px}
.card.ink{background:var(--negro);color:var(--crema);border-color:var(--negro)}
.card.sage{background:var(--salvia-cl);border-color:var(--salvia-cl)}
.back{border:0;background:none;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:6px 0}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.field input,.field textarea,.field select{border:1.5px solid var(--negro);border-radius:12px;padding:12px 14px;background:#fbf9f5;width:100%}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--negro);background:transparent;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--negro);color:var(--crema)}
.pill small{opacity:.7;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:var(--salvia-cl);color:var(--negro)}
.tag.ink{background:var(--negro);color:var(--crema)}
.tag.out{background:transparent;border:1px dashed var(--tinta-2);color:var(--tinta-2)}

/* star decoration from the menu */
.star{position:absolute;color:var(--salvia);pointer-events:none}

/* ---------- stamps (postage-style) ---------- */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamp{--c:var(--salvia-cl);aspect-ratio:4/5;padding:5px;background:radial-gradient(circle at 5px 5px,transparent 3.2px,var(--c) 3.6px) -5px -5px/10px 10px;position:relative}
.stamp .in{height:100%;background:var(--c);display:grid;place-items:center;position:relative;border:1.5px dashed rgba(29,29,27,.35)}
.stamp svg{width:58%;height:auto;color:rgba(29,29,27,.28)}
.stamp .num{position:absolute;bottom:4px;right:6px;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;color:rgba(29,29,27,.45)}
.stamp.on{--c:var(--salvia)}
.stamp.on .in{border:1.5px solid var(--negro)}
.stamp.on svg{color:var(--negro)}
.stamp.on .num{color:var(--negro)}
.stamp.free{--c:var(--negro)}
.stamp.free .in{border:1.5px solid var(--crema);color:var(--crema);text-align:center}
.stamp.free .in b{font-family:var(--display);font-weight:900;font-stretch:70%;font-size:15px;line-height:.95;text-transform:uppercase;display:block}
.stamp.free .in span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.stamp.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.stamp.pop .in::after{content:"";position:absolute;inset:-6px;border:2px solid var(--negro);border-radius:50%;transform:rotate(-12deg);animation:ink .7s ease-out forwards}
@keyframes pop{0%{transform:scale(1.5) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes ink{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.stamp.pop,.stamp.pop .in::after,.toast,.push{animation:none!important}}

.meter{height:8px;border-radius:99px;background:var(--salvia-cl);overflow:hidden}
.meter i{display:block;height:100%;background:var(--negro);border-radius:99px}

/* QR */
.qrbox{background:#fff;border:1.5px solid var(--negro);border-radius:18px;padding:16px;display:grid;justify-items:center;gap:10px}
.qrbox svg.qr{width:190px;height:190px}
.ring{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}

/* menu list */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px;margin:0 -20px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .pill{white-space:nowrap}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--linea);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.item .nm{font-weight:800;text-transform:uppercase;font-stretch:88%;font-size:15.5px;letter-spacing:.01em}
.item .sz{font-weight:600;font-size:12px;color:var(--tinta-2);margin-left:6px;text-transform:none}
.item .ds{grid-column:1;font-size:13px;color:var(--tinta-2)}
.item .tags{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.item[disabled]{opacity:.45;cursor:not-allowed}

/* cup label (stamp-style sticker) */
.label{border:1.5px solid var(--negro);border-radius:6px;background:var(--crema);padding:12px 14px;position:relative}
.label::before,.label::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--hueso);border:1.5px solid var(--negro);transform:translateY(-50%)}
.label::before{left:-8px;clip-path:inset(0 0 0 50%)}
.label::after{right:-8px;clip-path:inset(0 50% 0 0)}

.steps{display:grid;gap:0}
.stepi{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding-bottom:14px;position:relative}
.stepi .dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--negro);display:grid;place-items:center;background:var(--hueso);font-size:12px;font-weight:800;z-index:1}
.stepi.done .dot{background:var(--negro);color:var(--crema)}
.stepi.now .dot{background:var(--salvia)}
.stepi:not(:last-child)::before{content:"";position:absolute;left:13.25px;top:28px;bottom:0;width:1.5px;background:var(--negro)}
.stepi b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.03em}

.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--linea);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-size:14.5px}
.toggle{width:44px;height:26px;border-radius:99px;border:1.5px solid var(--negro);background:var(--salvia-cl);position:relative;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--negro);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--salvia)}
.toggle[aria-checked="true"]::after{left:20px}

.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--negro);color:var(--crema);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;z-index:30;animation:up .3s ease-out}
.push{position:absolute;left:10px;right:10px;top:48px;background:rgba(251,249,245,.97);border:1.5px solid var(--negro);border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:36px 1fr;gap:10px;z-index:31;animation:down .35s ease-out;box-shadow:0 12px 30px -16px rgba(0,0,0,.5)}
.push .ic{width:36px;height:36px;border-radius:9px;background:var(--negro);display:grid;place-items:center}
.push .ic .logo{width:28px;color:var(--crema)}
.push b{font-size:13px}.push p{margin:0;font-size:13px}
@keyframes up{from{transform:translateY(12px);opacity:0}}
@keyframes down{from{transform:translateY(-16px);opacity:0}}
.sheet{position:absolute;inset:0;background:rgba(29,29,27,.45);z-index:40;display:flex;align-items:flex-end}
.sheet .body{background:var(--hueso);width:100%;border-radius:24px 24px 0 0;padding:20px 20px 30px;display:grid;gap:12px}

.codebox{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.codebox input{text-align:center;font-weight:800;font-size:20px;border:1.5px solid var(--negro);border-radius:10px;padding:12px 0;background:#fbf9f5;width:100%;min-width:0}

/* ---------- tablet (barista) ---------- */
.tablet{background:var(--negro);border-radius:30px;padding:14px;max-width:1080px;margin:0 auto;box-shadow:0 30px 60px -30px rgba(29,29,27,.55)}
.tablet .screen{border-radius:18px;min-height:640px;height:auto}
@media (max-width:640px){.tablet{padding:0;background:transparent;box-shadow:none}.tablet .screen{border:1.5px solid var(--negro)}}
.bar-top{background:var(--negro);color:var(--crema);display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.bar-top .logo{width:58px;color:var(--crema)}
.bar-top .seg button{font-size:12.5px}
.bar-body{padding:18px;flex:1}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{background:#e9e4da;border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start;min-height:160px}
.col h4{margin:0;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.ticket{background:var(--crema);border:1.5px solid var(--negro);border-radius:10px;padding:12px;display:grid;gap:8px}
.ticket.new{box-shadow:0 0 0 3px var(--salvia)}
.ticket ul{margin:0;padding-left:16px;font-size:13.5px}
.ticket .who{font-family:var(--display);font-weight:900;font-stretch:78%;text-transform:uppercase;font-size:19px;line-height:1}
.scan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
@media (max-width:820px){.scan{grid-template-columns:minmax(0,1fr)}}
.viewfinder{background:#222220;border-radius:18px;aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden;color:var(--crema)}
.viewfinder .frame{width:52%;aspect-ratio:1;border:3px solid var(--salvia);border-radius:18px;position:relative}
.viewfinder .laser{position:absolute;left:8%;right:8%;height:2px;background:var(--salvia);top:50%;box-shadow:0 0 12px var(--salvia);animation:laser 2s ease-in-out infinite alternate}
@keyframes laser{from{top:12%}to{top:88%}}
@media (prefers-reduced-motion:reduce){.viewfinder .laser{animation:none}}

/* ---------- owner desk ---------- */
.desk{background:#fbf9f5;border:1.5px solid var(--negro);border-radius:20px;overflow:hidden}
.desk-top{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1.5px solid var(--negro);flex-wrap:wrap}
.desk-top .logo{width:70px}
.desk-grid{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:620px}
@media (max-width:820px){.desk-grid{grid-template-columns:minmax(0,1fr)}}
.side{border-right:1.5px solid var(--negro);padding:14px;display:grid;gap:4px;align-content:start}
@media (max-width:820px){.side{border-right:0;border-bottom:1.5px solid var(--negro);display:flex;flex-wrap:wrap}}
.side button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600}
.side button[aria-current="true"]{background:var(--negro);color:var(--crema)}
.desk-main{padding:20px;display:grid;gap:20px;align-content:start;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1.5px solid var(--negro);border-radius:14px;padding:14px;background:var(--hueso)}
.kpi .v{font-family:var(--display);font-weight:900;font-stretch:75%;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tbl-wrap{overflow-x:auto;border:1.5px solid var(--negro);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--linea);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--hueso);position:sticky;top:0}
td input.price-in{width:76px;border:1.5px solid var(--linea);border-radius:8px;padding:5px 8px;background:#fff;font-variant-numeric:tabular-nums}
.alert{border-left:4px solid var(--alerta);background:#f6e7df;padding:10px 14px;border-radius:0 10px 10px 0;font-size:13.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}

/* ---------- stack doc ---------- */
.doc{max-width:860px;display:grid;gap:26px}
.doc h2{font-family:var(--display);font-weight:900;font-stretch:75%;text-transform:uppercase;font-size:28px;line-height:1;margin:0 0 10px}
.doc p{margin:0 0 10px;max-width:68ch}
.verdict{background:var(--negro);color:var(--crema);border-radius:20px;padding:22px;display:grid;gap:14px;position:relative;overflow:hidden}
.verdict .big{font-family:var(--display);font-weight:900;font-stretch:70%;text-transform:uppercase;font-size:clamp(28px,5vw,44px);line-height:.95}
.verdict .big em{font-style:normal;color:var(--salvia)}
.doc table{min-width:560px}
.doc ul{margin:0;padding-left:20px;display:grid;gap:8px;max-width:70ch}
</style>

<header class="top">
  <span class="logo word" aria-label="Junio"></span>
  <span class="meta">Prototipo clicable · semanas 2 y 3</span>

function isOpen(){const n=cabosNow(),mins=n.h*60+n.m;if(n.d==='Sun')return false;if(n.d==='Sat')return mins>=480&&mins<960;return mins>=420&&mins<1140}

function qrSvg(text){
 let n,dark;
 try{const q=qrcode(0,'M');q.addData(text);q.make();n=q.getModuleCount();dark=(r,c)=>q.isDark(r,c)}
 catch(e){n=29;let h=0;for(const ch of text)h=(h*31+ch.charCodeAt(0))>>>0;const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296};const g=[];for(let r=0;r<n;r++){g[r]=[];for(let c=0;c<n;c++)g[r][c]=rnd()>.5}const fin=(R,C)=>{for(let r=0;r<7;r++)for(let c=0;c<7;c++)g[R+r][C+c]=r===0||r===6||c===0||c===6||(r>1&&r<5&&c>1&&c<5)};fin(0,0);fin(0,n-7);fin(n-7,0);dark=(r,c)=>g[r][c]}
 let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))d+=`M${c} ${r}h1v1h-1z`;
 return`<svg class="qr" viewBox="-1 -1 ${n+2} ${n+2}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><path d="${d}" fill="#1D1D1B"/></svg>`;
}

/* ================== stack ================== */
function viewStack(){return`<div class="intro"><h1>Tecnología</h1><p>Recomendación corta para la semana 3, pensada para un café de un solo local con Square en caja y terminal de Mercado Pago.</p></div>
<div class="doc">
 <section class="verdict"><svg class="star" viewBox="0 0 24 24" style="width:120px;right:-24px;top:-20px">${IC.star}</svg>
  <span class="eyebrow" style="color:var(--salvia-cl)">Recomendación</span>
  <div class="big">React Native con Expo<br><em>+ Supabase</em></div>
  <p style="margin:0;color:var(--crema);max-width:62ch">Un solo lenguaje (TypeScript) para las tres piezas: app de clientes, app de barra y panel del dueño en web. Menos código, un solo equipo y menos costo de mantenimiento, que es lo que más pesa en un negocio de un local.</p></section>
 <section><h2>Por qué</h2><ul>
  <li><b>Expo</b> compila para iOS y Android desde un solo proyecto, publica en las tiendas con su servicio de builds y permite mandar correcciones sin esperar revisión de Apple en cambios menores.</li>
  <li><b>La app de barra</b> puede ser la misma app con un rol de barista, o una segunda app pequeña que comparte el código. El panel del dueño se hace en web (Next.js) reutilizando los mismos tipos y reglas.</li>
  <li><b>Supabase</b> es una base de datos Postgres. Las reglas de Junio Rewards son relacionales: 1 sello por día por cliente, vencimiento a 6 meses desde la última visita, bebida gratis a 60 días, registro de quién dio cada sello. En Postgres eso se garantiza con restricciones y no depende del código de la app.</li>
  <li><b>Tiempo real</b> incluido: el pedido aparece en la tablet de la barra al instante y el estado le llega al cliente sin recargar.</li>
  <li><b>Funciones del servidor</b> (Edge Functions) para recibir los avisos de pago de Mercado Pago, firmar el QR dinámico y, en la fase 2, conectar con Square.</li>
 </ul></section>
 <section><h2>Las alternativas</h2><div class="tbl-wrap"><table><thead><tr><th></th><th>Elegido</th><th>Alternativa</th><th>Cuándo elegir la alternativa</th></tr></thead><tbody>
  <tr><td><b>App</b></td><td>React Native + Expo</td><td>Flutter</td><td>Si el equipo de desarrollo ya domina Dart. Flutter da animaciones muy finas, pero el panel web quedaría en otra tecnología.</td></tr>
  <tr><td><b>Backend</b></td><td>Supabase</td><td>Firebase</td><td>Si se quiere todo en Google. Firebase es excelente para notificaciones, pero su base de datos es de documentos y las reglas de sellos se vuelven más difíciles de garantizar.</td></tr>
 </tbody></table></div><p class="small" style="margin-top:8px">Las notificaciones push funcionan igual con cualquiera de los dos: Expo Notifications usa Apple y Firebase Cloud Messaging por debajo.</p></section>
 <section><h2>Pagos y caja</h2><ul>
  <li><b>Mercado Pago (MVP).</b> Cobro con tarjeta dentro de la app usando su SDK y tarjetas guardadas. El pago se confirma en el servidor con el aviso (webhook) de Mercado Pago antes de mandar el pedido a la barra. Los pagos en barra siguen en la terminal actual.</li>
  <li><b>Apple Pay y Google Pay:</b> hay que confirmar con Mercado Pago México que estén disponibles para esta cuenta. Si no, el MVP sale con tarjeta y se agregan después.</li>
  <li><b>Comisión de las tiendas:</b> Apple y Google no cobran comisión por vender café y comida (son bienes físicos), así que se puede usar Mercado Pago sin pasar por sus sistemas de pago.</li>
  <li><b>Square (fase 2).</b> Su API permite crear los pedidos de la app como tickets en Square y leer las ventas de barra para ligar cada sello a un ticket real. En el MVP el barista sella con el QR.</li>
 </ul></section>
 <section><h2>Qué validar con el dueño esta semana</h2><ul>
  <li>Que la tarjeta de estampillas y los textos ("Ya casi huele a gratis") suenen a Junio.</li>
  <li>El flujo de pedido completo, incluyendo pagar en la app o en barra.</li>
  <li>Que la app de barra sea suficiente para hora pico.</li>
  <li>Licencia de Owners Text para app móvil, y si podemos exportar las letras de pincel del menú.</li>
  <li>Fotos reales del equipo y del espacio para la pantalla "La barra".</li>
 </ul></section>
</div>`}

let toastT,pushT;
function toast(msg){const o=document.getElementById('overlay');if(!o)return;o.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${esc(msg)}</div>`);clearTimeout(toastT);toastT=setTimeout(()=>{o.querySelectorAll('.toast').forEach(e=>e.remove())},2600)}
let pendingPush=null;
function push(msg){pendingPush=msg}
function showPush(){if(!pendingPush)return;const o=document.getElementById('overlay');if(!o)return;o.querySelectorAll('.push').forEach(e=>e.remove());o.insertAdjacentHTML('beforeend',`<div class="push" role="status"><span class="ic"><span class="logo word"></span></span><div><b>Junio · ${S.lang==='es'?'ahora':'now'}</b><p>${esc(pendingPush)}</p></div></div>`);pendingPush=null;clearTimeout(pushT);pushT=setTimeout(()=>o.querySelectorAll('.push').forEach(e=>e.remove()),4200)}

function render(){
 document.querySelectorAll('.top .seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
 const app=document.getElementById('app');
 const sc=document.querySelector('.scroll'),keep=sc?sc.scrollTop:0,sameScreen=render.last===S.view+S.screen;
 app.innerHTML=S.view==='cliente'?viewCliente():S.view==='barista'?viewBarista():S.view==='dueno'?viewDueno():viewStack();
 if(sameScreen){const n=document.querySelector('.scroll');if(n)n.scrollTop=keep}
 render.last=S.view+S.screen;
 tick();showPush();
 if(S.popIdx>=0)setTimeout(()=>{S.popIdx=-1},800);
}
function tick(){const r=document.getElementById('ring');if(!r)return;const left=60-Math.floor(Date.now()/1000)%60;const c=2*Math.PI*9;
 r.innerHTML=`<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke="#CED2BB" stroke-width="3"/><circle cx="11" cy="11" r="9" fill="none" stroke="#1D1D1B" stroke-width="3" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-left/60)}"/></svg>${t('new_in')} 0:${String(left).padStart(2,'0')}`;
 if(left===60||!tick.tok||tick.tok!==qrToken()){tick.tok=qrToken();const q=document.getElementById('qr');if(q)q.innerHTML=qrSvg(tick.tok)}}
setInterval(tick,1000);

function setView(v){S.view=v;if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);render();window.scrollTo(0,0)}
function placeOrder(){
 const {tot}=cartTotals();const id='J-0'+(++S.orderSeq);
 S.orders.unshift({id,lines:S.cart.map(l=>({...l})),total:tot,status:'received',pay:S.pay,when:S.pickup==='asap'?'ASAP':S.pickTime});
 if(S.cart.some(l=>l.free)){S.free--;S.stats.redeems++}
 S.stats.orders++;if(S.pay==='app')S.stats.sales+=tot;
 S.cart=[];go('status',{id});
}
function advance(id){
 const o=S.orders.find(x=>x.id===id);if(o){const i=ST.indexOf(o.status);if(i<3){o.status=ST[i+1];if(o.status==='ready')push(t('push_ready',{name:S.user.name}));if(o.status==='done'){if(o.pay==='bar')S.stats.sales+=o.total;giveStamp(S.lang==='es'?'Pedido #'+o.id:'Order #'+o.id)}}return}
 const e=S.extraOrders.find(x=>x.id===id);if(e){const i=ST.indexOf(e.status);if(i<2)e.status=ST[i+1];else S.extraOrders=S.extraOrders.filter(x=>x!==e)}
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-go]');if(!b)return;
 const d=b.dataset;
 if(d.view){setView(d.view);return}
 if(d.jump){go(d.jump,d.jump==='product'?{id:'latte'}:d.jump==='status'?{id:S.orders[0]?.id}:{});if(d.jump==='status'&&!S.orders.length){S.orders.push({id:'J-024',lines:[{name:'Latte',qty:1,unit:80,desc:'Avena',coffee:true}],total:100,status:'preparing',pay:'app',when:'ASAP'});S.orderSeq=24;go('status',{id:'J-024'})}return}
 if(d.lang){S.lang=d.lang;render();return}
 if(d.cat&&!d.go){S.params.cat=d.cat;render();return}
 if(d.go){const p={};if(d.id)p.id=d.id;if(d.cat)p.cat=d.cat;go(d.go,p);return}
 if(d.opt){const o=S.params.o;if(d.opt==='shot')o.shot=!o.shot;else if(d.opt==='qty')o.qty=Math.max(1,o.qty+(+d.val));else o[d.opt]=d.val;const nt=document.getElementById('nt');if(nt)o.notes=nt.value;render();return}
 if(d.set){S[d.set]=d.val;render();return}
 if(d.notif){S.notif[d.notif]=!S.notif[d.notif];render();return}
 if(d.bartab){S.barTab=d.bartab;render();return}
 if(d.desk){S.deskTab=d.desk;render();return}
 if(d.dessert){const x=S.desserts.find(y=>y.id===d.dessert);x.out=!x.out;render();return}
 if(d.sold){S.soldout[d.sold]=!S.soldout[d.sold];render();return}
 if(d.bar){if(d.mine==='1'){advance(d.bar);}else advance(d.bar);render();return}
 const a=d.act;if(!a)return;
 if(a==='sendcode'){S.user.phone=document.getElementById('ph').value||S.user.phone;go('code')}
 else if(a==='savename'){S.user.name=(document.getElementById('nm').value||'Sofía').trim();S.user.bday=document.getElementById('bd').value;if(S.stamps===0&&!S.log.length){S.stamps=1;S.popIdx=0;S.log.unshift({d:S.lang==='es'?'hoy':'today',what:S.lang==='es'?'Sello de bienvenida':'Welcome stamp',type:'+1'})}go(S.log.length===1&&S.screen==='name'?'wstamp':'home')}
 else if(a==='addcart'){const m=prodById(S.params.id);const o=S.params.o;const nt=document.getElementById('nt');if(nt)o.notes=nt.value;S.cart.push({id:m.id,name:m.name+(m.size?' '+m.size:''),qty:o.qty,unit:optPrice(m,o),desc:lineDesc(m,o),coffee:!!m.coffee,free:false});go('menu',{cat:m.cat});toast(t('added'))}
 else if(a==='togglefree'){const l=S.cart[+d.i];l.free=!l.free;render()}
 else if(a==='rmline'){S.cart.splice(+d.i,1);render()}
 else if(a==='place')placeOrder();
 else if(a==='advance'){advance(d.id);render()}
 else if(a==='repeat'){const src=d.id?S.orders.find(o=>o.id===d.id):null;S.cart=src?src.lines.map(l=>({...l,free:false})):[{id:'shaken',name:'Junio shaken espresso 20oz',qty:1,unit:120,desc:t('m_oat'),coffee:true,free:false}];go('cart')}
 else if(a==='askdel'){document.getElementById('overlay').innerHTML=`<div class="sheet"><div class="body"><span class="h-l">${t('delete_q')}</span><p style="margin:0">${t('delete_s')}</p><button class="btn dark" data-act="dodel">${t('confirm_del')}</button><button class="btn line" data-act="closesheet">${t('cancel')}</button></div></div>`}
 else if(a==='closesheet')render();
 else if(a==='dodel'){const v=S.view;S=fresh();S.view=v;render()}
 else if(a==='barstamp'){giveStamp(S.lang==='es'?'Compra en barra':'Bar purchase');if(S.view==='cliente'&&!['rewards','home'].includes(S.screen))S.screen='rewards';render()}
 else if(a==='nextday'){S.stampedToday=false;S.scanned=S.scanned;render()}
 else if(a==='six'){S.stamps=6;S.stampedToday=false;if(!S.log.length)S.log.unshift({d:'',what:'Sellos anteriores',type:'+6'});go('rewards')}
 else if(a==='reset'){const v=S.view;S=fresh();S.view=v;render()}
 else if(a==='doscan'){S.scanned=true;render()}
 else if(a==='unscan'){S.scanned=false;render()}
 else if(a==='scanstamp'){if(!document.getElementById('hasdrink').checked){alertInline('Sin bebida no hay sello.');return}giveStamp(S.lang==='es'?'Compra en barra':'Bar purchase');pendingPush=null;render()}
 else if(a==='redeem'){S.free--;S.stats.redeems++;S.log.unshift({d:'',what:S.lang==='es'?'Bebida gratis canjeada':'Free drink redeemed',type:'★'});render()}
 else if(a==='adddessert'){const n=document.getElementById('newd').value.trim();if(!n)return;S.desserts.push({id:'d'+Date.now(),name:n,price:+document.getElementById('newdp').value,out:false});render()}
 else if(a==='saveguest'){document.querySelectorAll('[data-guest]').forEach(i=>S.guest[i.dataset.guest]=i.value);const btn=b;btn.textContent='Publicado ✓';setTimeout(()=>{btn.textContent='Publicar en la app'},1500)}
});
function alertInline(m){const c=document.querySelector('.scan .card');if(c)c.insertAdjacentHTML('afterbegin',`<div class="alert">${esc(m)}</div>`)}
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.price){const v=parseInt(el.value,10);if(!isNaN(v))S.prices[el.dataset.price]=v}
 if(el.dataset.guest){S.guest[el.dataset.guest]=el.value;const r=document.getElementById('gp-roaster');if(r){r.textContent=S.guest.roaster;document.getElementById('gp-line').textContent=`${S.guest.origin} · ${S.guest.process} · ${S.guest.alt}`;document.getElementById('gp-notes').textContent=S.guest.notes}}
 if(el.id==='nt'&&S.params.o)S.params.o.notes=el.value;
});
const startView=()=>{const h=location.hash.slice(1);return['cliente','barista','dueno','stack'].includes(h)?h:'cliente'};
window.addEventListener('hashchange',()=>{const v=startView();if(v!==S.view){S.view=v;render()}});
S.view=startView();render();
</script>
